# Rebuilds the documentation PDFs whenever the docs change, and commits them.
name: Build PDFs

on:
  push:
    branches: [main]
    paths:
      - "docs/*.md"
      - "docs/images/**"
      - ".github/pdf-config.json"
      - ".github/workflows/pdf.yml"
  workflow_dispatch: # run by hand after updating schenktronics-docs-tools

permissions:
  contents: write

concurrency:
  group: pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the "Updated" date comes from git history
      - uses: Schenktronics/schenktronics-docs-tools/pdf@v1
        with:
          config: .github/pdf-config.json
